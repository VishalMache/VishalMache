<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Vishal Mache, mobile and full-stack developer">
<defs>
  <radialGradient id="glow" cx="80%" cy="50%" r="60%"><stop offset="0" stop-color="#d32f2f" stop-opacity=".38"/><stop offset="1" stop-color="#d32f2f" stop-opacity="0"/></radialGradient>
  <linearGradient id="beam" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#fff4e0" stop-opacity=".32"/><stop offset=".7" stop-color="#fff4e0" stop-opacity=".05"/><stop offset="1" stop-color="#fff4e0" stop-opacity="0"/></linearGradient>
  <pattern id="perf" width="36" height="26" patternUnits="userSpaceOnUse"><rect x="9" y="7" width="18" height="12" rx="3" fill="#f5f2ea" opacity=".9"/></pattern>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#f5f2ea" opacity=".07"/></pattern>
  <clipPath id="c"><rect width="1200" height="300" rx="20"/></clipPath>
</defs>
<style>
  .strip { animation: slide 1.8s linear infinite; }
  .strip.b { animation-direction: reverse; }
  @keyframes slide { to { transform: translateX(-36px); } }
  .spin { animation: spin 5s linear infinite; }
  .spin2 { animation: spin 3.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .beam { animation: flick 2.6s ease-in-out infinite; }
  @keyframes flick { 0%,100% { opacity: 1; } 47% { opacity: .55; } 50% { opacity: .9; } 53% { opacity: .6; } }
  .k { font: 800 15px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 6px; fill: #ff6b6b; }
  .name { font: 400 84px Impact, 'Arial Narrow Bold', 'Arial Black', sans-serif; letter-spacing: 3px; fill: #f5f2ea; }
  .bar { transform-origin: 72px 0; animation: grow 1.2s cubic-bezier(.2,.8,.2,1) both .3s; }
  @keyframes grow { from { transform: scaleX(0); } }
  .role { font: 600 24px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e9e2d4; opacity: 0; animation: roles 9s infinite; }
  .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; }
  @keyframes roles { 0% { opacity: 0; transform: translateY(10px); } 5%, 29% { opacity: 1; transform: none; } 34%, 100% { opacity: 0; transform: translateY(-10px); } }
  .fade { animation: in 1s ease both; }
  @keyframes in { from { opacity: 0; transform: translateY(14px); } }
  .dust { animation: drift 7s linear infinite; }
  @keyframes drift { from { transform: translate(0,0); opacity: 0; } 20% { opacity: .7; } to { transform: translate(-260px,-30px); opacity: 0; } }
</style>
<g clip-path="url(#c)">
  <rect width="1200" height="300" fill="#0c0b0b"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <polygon class="beam" points="905,128 470,40 470,262 905,172" fill="url(#beam)"/>
  <circle class="dust" cx="870" cy="120" r="1.2" fill="#fff4e0" style="animation-delay:-0.0s"/><circle class="dust" cx="833" cy="173" r="1.7999999999999998" fill="#fff4e0" style="animation-delay:-0.9s"/><circle class="dust" cx="796" cy="166" r="2.4" fill="#fff4e0" style="animation-delay:-1.8s"/><circle class="dust" cx="759" cy="159" r="1.2" fill="#fff4e0" style="animation-delay:-2.7s"/><circle class="dust" cx="722" cy="152" r="1.7999999999999998" fill="#fff4e0" style="animation-delay:-3.6s"/><circle class="dust" cx="685" cy="145" r="2.4" fill="#fff4e0" style="animation-delay:-4.5s"/><circle class="dust" cx="648" cy="138" r="1.2" fill="#fff4e0" style="animation-delay:-5.4s"/><circle class="dust" cx="611" cy="131" r="1.7999999999999998" fill="#fff4e0" style="animation-delay:-6.3s"/>
  <rect width="1200" height="26" fill="#050505"/><rect y="274" width="1200" height="26" fill="#050505"/>
  <g class="strip"><rect width="1240" height="26" fill="url(#perf)"/></g>
  <g class="strip b"><rect y="274" x="-36" width="1240" height="26" fill="url(#perf)"/></g>
  <g class="fade">
    <text x="72" y="86" class="k">NOW SHOWING</text>
    <text x="68" y="168" class="name">VISHAL MACHE</text>
    <rect class="bar" x="72" y="184" width="150" height="6" fill="#d32f2f"/>
  </g>
  <text x="72" y="232" class="role">Mobile &amp; full-stack developer</text>
  <text x="72" y="232" class="role r2">Building Screenique 🎬</text>
  <text x="72" y="232" class="role r3">Exploring AI agents &amp; automation</text>
  <rect x="915" y="186" width="190" height="56" rx="8" fill="#1d1819" stroke="#2c2526"/>
  <rect x="1000" y="130" width="34" height="60" fill="#1d1819"/>
  <circle cx="1105" cy="214" r="15" fill="#2c2526"/><circle cx="1105" cy="214" r="7" fill="#fff4e0" opacity=".9"/>
  <g class="spin" style="transform-origin:948px 118px"><circle cx="948" cy="118" r="66" fill="#d32f2f"/><circle cx="948" cy="118" r="56.8" fill="none" stroke="#0c0b0b" stroke-width="2" opacity=".35"/><circle cx="982.3" cy="118.0" r="13.2" fill="#0c0b0b"/><circle cx="965.2" cy="147.7" r="13.2" fill="#0c0b0b"/><circle cx="930.8" cy="147.7" r="13.2" fill="#0c0b0b"/><circle cx="913.7" cy="118.0" r="13.2" fill="#0c0b0b"/><circle cx="930.8" cy="88.3" r="13.2" fill="#0c0b0b"/><circle cx="965.2" cy="88.3" r="13.2" fill="#0c0b0b"/><circle cx="948" cy="118" r="9.2" fill="#0c0b0b"/></g>
  <g class="spin2" style="transform-origin:1078px 104px"><circle cx="1078" cy="104" r="50" fill="#d32f2f"/><circle cx="1078" cy="104" r="43.0" fill="none" stroke="#0c0b0b" stroke-width="2" opacity=".35"/><circle cx="1104.0" cy="104.0" r="10.0" fill="#0c0b0b"/><circle cx="1091.0" cy="126.5" r="10.0" fill="#0c0b0b"/><circle cx="1065.0" cy="126.5" r="10.0" fill="#0c0b0b"/><circle cx="1052.0" cy="104.0" r="10.0" fill="#0c0b0b"/><circle cx="1065.0" cy="81.5" r="10.0" fill="#0c0b0b"/><circle cx="1091.0" cy="81.5" r="10.0" fill="#0c0b0b"/><circle cx="1078" cy="104" r="7.0" fill="#0c0b0b"/></g>
</g>
</svg>